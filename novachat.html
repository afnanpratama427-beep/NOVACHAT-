<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>NOVACHAT</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>:root{--y:#FFE066;--c:#5CE1E6;--p:#FF90E8;--g:#B8FF9F;--r:#FF8A8A;--b:3.5px solid #000;--s:6px 6px 0 #000}*{box-sizing:border-box;margin:0;padding:0;font-family:'Space Grotesk',sans-serif}body{background:#F5F1E8;height:100dvh;overflow:hidden}button:active{transform:scale(0.96)}.hidden{display:none!important}#skeleton{position:fixed;inset:0;background:#F5F1E8;z-index:999;padding:16px}#feedback{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-100px);background:#000;color:#fff;padding:10px 18px;border:3.5px solid #000;box-shadow:var(--s);z-index:600;transition:.3s}#feedback.show{transform:translateX(-50%) translateY(0)}#auth{position:fixed;inset:0;background:#F5F1E8;display:flex;flex-direction:column;padding:16px;overflow-y:auto;z-index:100}.auth-logo{text-align:center;margin:20px 0}.auth-logo h1{font-family:Syne;font-size:42px;background:var(--y);padding:6px 20px;border:var(--b);box-shadow:var(--s);transform:rotate(-2deg);display:inline-block}.auth-boxes{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.auth-box{flex:1 1 280px;background:#fff;border:var(--b);box-shadow:var(--s);padding:16px}.auth-box input{width:100%;padding:11px;border:2.5px solid #000;margin-top:8px;outline:none}.auth-box button{width:100%;margin-top:12px;padding:12px;border:var(--b);box-shadow:4px 4px 0 #000;font-weight:900}.auth-box.register button{background:var(--g)}.auth-box.login button{background:var(--y)}.auth-msg{margin-top:8px;padding:8px;border:2px solid #000;font-size:12px;display:none}.auth-msg.err{display:block;background:#ffd1d1}.auth-msg.ok{display:block;background:var(--g)}#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#F5F1E8}.app-header{height:64px;background:#fff;border-bottom:var(--b);display:flex;align-items:center;padding:0 14px;gap:10px}.icon-btn{width:40px;height:40px;background:#fff;border:2.5px solid #000;box-shadow:3px 3px 0 #000;display:grid;place-items:center;font-weight:900;flex-shrink:0}.main-scroll{flex:1;overflow-y:auto;padding:14px 14px 180px}.tab-view{display:none}.tab-view.active{display:block}.section-title{font-size:12px;font-weight:900;padding:5px 10px;border:2.5px solid #000;display:inline-block;margin-bottom:12px;background:#fff}.contact-item{display:flex;gap:12px;padding:12px;background:#fff;border:var(--b);box-shadow:4px 4px 0 #000;margin-bottom:10px;cursor:pointer}.avatar{width:48px;height:48px;border:2.5px solid #000;display:grid;place-items:center;font-weight:900;font-size:20px;background:#ddd;overflow:hidden;flex-shrink:0;background-size:cover;background-position:center}.avatar img{width:100%;height:100%;object-fit:cover}.floating-nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#fff;border:var(--b);border-radius:999px;box-shadow:var(--s);display:flex;gap:2px;padding:6px;z-index:30}.nav-btn{padding:10px 16px;border-radius:999px;border:none;background:transparent;font-weight:900;font-size:12px}.nav-btn.active{background:var(--y)}.fab{position:fixed;right:18px;bottom:100px;width:60px;height:60px;border:var(--b);border-radius:50%;box-shadow:var(--s);display:grid;place-items:center;font-size:26px;font-weight:900;background:var(--y);z-index:40}#chatRoom{position:fixed;inset:0;background:#EFE7DD;display:none;flex-direction:column;z-index:60}#chatRoom.open{display:flex}.chat-header{height:64px;background:#fff;border-bottom:var(--b);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0}.chat-header-main{flex:1;display:flex;gap:10px;align-items:center;min-width:0;cursor:pointer}.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px;background:#E5DDD5 url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}.bubble{max-width:76%;padding:8px 10px 6px;border-radius:8px;font-size:14.5px;box-shadow:0 1px 0.5px rgba(0,0,0,.13);border:1px solid rgba(0,0,0,.08)}.bubble.other{align-self:flex-start;background:#fff;border-top-left-radius:0}.bubble.me{align-self:flex-end;background:#DCF8C6;border-top-right-radius:0}.bubble-time{font-size:10px;margin-top:4px;display:flex;gap:4px;justify-content:flex-end;opacity:.8}#toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%) translateY(150px);background:#323232;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;z-index:700;transition:.28s}#toast.show{transform:translateX(-50%) translateY(0)}.ctx-menu{position:fixed;top:70px;right:12px;background:#fff;border:var(--b);box-shadow:var(--s);display:none;flex-direction:column;min-width:220px;z-index:200}.ctx-menu.open{display:flex}.ctx-menu button{padding:14px 16px;background:#fff;border:none;border-bottom:2px solid #000;text-align:left;font-weight:700}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;padding:12px;z-index:300}.modal-overlay.open{display:grid}.modal{background:#fff;border:var(--b);box-shadow:var(--s);padding:0;max-width:430px;width:100%;max-height:94vh;overflow-y:auto;display:flex;flex-direction:column}.modal-pad{padding:16px;overflow-y:auto;flex:1}.status-card{display:flex;gap:12px;align-items:center;background:#fff;border:var(--b);box-shadow:4px 4px 0 #000;padding:12px;margin-bottom:10px;cursor:pointer}.confirm-box{background:#fff;border:var(--b);box-shadow:8px 8px 0 #000;padding:0;max-width:340px;width:100%}.confirm-head{padding:14px 16px;background:var(--y);border-bottom:var(--b);font-weight:900;font-size:16px}.confirm-body{padding:16px;font-size:14px}.confirm-actions{display:flex;border-top:var(--b)}.confirm-actions button{flex:1;padding:14px;border:none;border-right:var(--b);font-weight:900}.confirm-actions .ok{background:var(--r)}.confirm-actions .cancel{background:#eee}.file-bar{display:flex;gap:6px;padding:8px 10px;background:#F0F0F0;border-top:1px solid #ddd}.file-chip{padding:6px 14px;border:2.5px solid #000;border-radius:999px;font-size:11px;font-weight:800;box-shadow:2px 2px 0 #000}.chat-input-bar{border-top:var(--b);background:#fff;padding:8px 10px;display:flex;gap:8px;align-items:flex-end}.chat-input-bar textarea{flex:1;padding:10px 16px;border:2.5px solid #000;border-radius:24px;resize:none;min-height:44px;max-height:100px;outline:none}.send-btn{width:46px;height:46px;background:var(--y);border:2.5px solid #000;border-radius:50%;box-shadow:3px 3px 0 #000;display:grid;place-items:center;font-size:20px}
</style></head><body>
<div id="skeleton"></div><div id="feedback"><span id="fbText">Memuat...</span></div>
<div id="auth"><div class="auth-logo"><h1>NOVACHAT</h1></div><div class="auth-boxes"><div class="auth-box register"><h2 style="background:var(--c);padding:4px 10px;border:2.5px solid #000;display:inline-block">DAFTAR</h2><input id="regUser" placeholder="Username"><input id="regPass" type="password" placeholder="Password"><input id="regName" placeholder="Nama"><button onclick="doRegister()">BUAT AKUN</button><div id="regMsg" class="auth-msg"></div></div><div class="auth-box login"><h2 style="background:var(--p);padding:4px 10px;border:2.5px solid #000;display:inline-block">LOGIN</h2><input id="logUser" placeholder="Username"><input id="logPass" type="password" placeholder="Password"><button onclick="doLogin()">MASUK</button><div id="logMsg" class="auth-msg"></div></div></div></div>
<div id="app" class="hidden"><div class="app-header"><h1 style="flex:1"><span style="background:var(--y);border:2.5px solid #000;padding:2px 8px">NOVACHAT</span></h1><button class="icon-btn" onclick="openEditProfile()">⋮</button></div><div class="main-scroll"><div id="tab-chat" class="tab-view active"><div class="section-title">Chat & Grup</div><button onclick="openCreateGroup()" style="width:100%;padding:10px;border:2.5px solid #000;background:var(--g);font-weight:900;margin-bottom:12px;box-shadow:3px 3px 0 #000">+ BUAT GRUP PAKAI ID</button><div id="contactList"></div></div><div id="tab-status" class="tab-view"><div class="section-title">Status 24 jam</div><div id="statusList"></div></div><div id="tab-set" class="tab-view"><div class="section-title">Saya</div><div id="profileCard"></div><div style="margin-top:12px;background:#fff;border:var(--b);box-shadow:var(--s);padding:14px"><b>Pesan:</b> <span id="memCount">0</span></div><button style="width:100%;margin-top:12px;padding:14px;background:#ff8080;border:var(--b);font-weight:900" onclick="confirmLogout()">LOGOUT</button></div></div><div class="floating-nav"><button class="nav-btn active" data-tab="chat" onclick="switchTab('chat',this)">Chat</button><button class="nav-btn" data-tab="status" onclick="switchTab('status',this)">Status</button><button class="nav-btn" data-tab="set" onclick="switchTab('set',this)">Saya</button></div></div>
<div id="fabChat" class="fab" onclick="openAddContact()">+</div>
<div id="chatRoom"><div class="chat-header"><button class="icon-btn" onclick="closeChat()">←</button><div class="chat-header-main" onclick="openHeaderProfile(event)"><div class="avatar" id="chatAvatar">?</div><div style="flex:1;min-width:0"><div id="chatName" style="font-weight:700">-</div><div id="chatSub" style="font-size:11px;opacity:.6">tap untuk lihat info lengkap • auto refresh on</div></div></div><button class="icon-btn" onclick="toggleChatMenu(event)">⋮</button></div><div class="chat-messages" id="chatMessages"></div><div class="file-bar"><button class="file-chip" style="background:var(--y)" onclick="pickFile('all')">File</button><button class="file-chip" style="background:var(--c)" onclick="pickFile('media')">Media</button><span id="upStat" style="font-size:11px;font-weight:800"></span><span id="autoStat" style="font-size:10px;opacity:.5;margin-left:auto">↻ auto 3s</span></div><div class="chat-input-bar"><textarea id="msgInput" rows="1" placeholder="Ketik pesan..."></textarea><button class="send-btn" onclick="sendText()">➤</button></div></div>
<div id="chatMenu" class="ctx-menu"><button onclick="handleMenuInfo()">👤 Lihat Info Lengkap</button><button onclick="confirmBlock()">🚫 Blokir Akun</button><button onclick="confirmReportUser()">🚩 Laporkan Akun</button><button onclick="confirmReportGroup()">🚩 Laporkan Grup</button><button onclick="confirmDeleteChat()">🗑️ Hapus Chat</button></div>
<div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalContent"></div></div><div id="confirmOverlay" class="modal-overlay"><div class="confirm-box" id="confirmBox"></div></div><div id="toast"></div>
<input type="file" id="fileInputAll" hidden onchange="handleFilePick(event)"><input type="file" id="fileInputMedia" accept="image/*,video/*" hidden onchange="handleFilePick(event)"><input type="file" id="avatarInput" accept="image/*" hidden onchange="handleAvatarPick(event)"><input type="file" id="statusFile" accept="image/*,video/*" hidden onchange="handleStatusFile(event)"><input type="file" id="groupAvatarInput" accept="image/*" hidden onchange="handleGroupAvatar(event)">
<script>
function hideSkeleton(){const s=document.getElementById('skeleton');if(s)s.style.display='none'}function showFeedback(t){const f=document.getElementById('feedback');const tx=document.getElementById('fbText');if(!f||!tx)return;tx.textContent=t;f.classList.add('show');setTimeout(()=>f.classList.remove('show'),2200)}function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}
const SUPABASE_URL="https://lnloeruwqboxniiegkuc.supabase.co";const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxubG9lcnV3cWJveG5paWVna3VjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxMzU3NDMsImV4cCI6MjEwOTcxMTc0M30.BFlp4l7E5E-6KN3NJVTc0bpIaQZQNXRNREvsas1BqhY";const NEOX="https://neox-storage.afnanpratama427.workers.dev/upload";let supa=null;try{supa=supabase.createClient(SUPABASE_URL,SUPABASE_ANON)}catch(e){}
let ME=null,currentChat=null,sub=null,msgCache=[],allUsers=[],added=JSON.parse(localStorage.getItem('novachat_added_contacts')||'[]'),pendingAvatar=null,pendingStatus=null,groups=JSON.parse(localStorage.getItem('novachat_groups')||'[]'),groupAvatars=JSON.parse(localStorage.getItem('novachat_group_avatars')||'{}'),blocked=JSON.parse(localStorage.getItem('novachat_blocked')||'[]'),groupReports=JSON.parse(localStorage.getItem('novachat_reports')||'{}'),bannedGroups=JSON.parse(localStorage.getItem('novachat_banned')||'[]');
const BLUE_CHECK=`<svg viewBox="0 0 24 24" width="18" height="18" style="vertical-align:middle"><path fill="#1DA1F2" d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.558l-5.25 7.5a1.5 1.5 0 01-2.2.2l-2.25-2.25a1.5 1.5 0 012.122-2.122l1.086 1.086 4.1-5.857a1.5 1.5 0 112.392 1.843z"/></svg>`;
async function hashPassSync(s){const b=new TextEncoder().encode(s+'::nvc');const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}async function uploadToNeox(file){showFeedback('Mengupload... 📤');const fd=new FormData();fd.append('file',file);try{const r=await fetch(NEOX,{method:'POST',body:fd});const j=await r.json();showFeedback('Upload selesai! ✅');return j.url||j.fileUrl||j.link||j.data?.url||null}catch{showFeedback('Upload gagal ❌');return null}}
function showConfirm({title='Konfirmasi',desc='Yakin?',okText='Oke',cancelText='Batal',onOk}){const box=document.getElementById('confirmBox');box.innerHTML=`<div class="confirm-head">${esc(title)}</div><div class="confirm-body">${esc(desc)}</div><div class="confirm-actions"><button class="cancel" onclick="closeConfirm()">${esc(cancelText)}</button><button class="ok" onclick="confirmOk()">${esc(okText)}</button></div>`;window._confirmOk=onOk;document.getElementById('confirmOverlay').classList.add('open')}function closeConfirm(){document.getElementById('confirmOverlay').classList.remove('open');window._confirmOk=null}function confirmOk(){const fn=window._confirmOk;closeConfirm();if(fn)fn()}function confirmBlock(){if(!currentChat?.partner_id){toast('Pilih chat orang');return}showConfirm({title:'Blokir Akun',desc:'Blokir Akun Ini?',okText:'Blokir',cancelText:'Batal',onOk:()=>blockUserFromId(currentChat.partner_id)})}function confirmReportUser(){if(!currentChat?.partner_id){toast('Pilih chat');return}showConfirm({title:'Laporkan Akun',desc:'Laporkan Akun Ini?',okText:'Laporkan',cancelText:'Batal',onOk:()=>reportUserFromId(currentChat.partner_id)})}function confirmReportGroup(){if(!currentChat?.groupId){toast('Buka grup dulu');return}showConfirm({title:'Laporkan Grup',desc:'Laporkan Grup Ini?',okText:'Laporkan',cancelText:'Batal',onOk:()=>reportGroup(currentChat.groupId)})}function confirmDeleteChat(){showConfirm({title:'Hapus Chat',desc:'Hapus semua pesan di chat ini?',okText:'Hapus',cancelText:'Batal',onOk:()=>deleteChatReal()})}function confirmLogout(){showConfirm({title:'Logout',desc:'Keluar dari akun?',okText:'Logout',cancelText:'Batal',onOk:()=>{localStorage.removeItem('novachat_me');location.reload()}})}function confirmKick(gid,mid){const u=allUsers.find(x=>x.id===mid);showConfirm({title:'Kick Anggota',desc:`Kick ${u?.display_name||'akun ini'} dari grup?`,okText:'Kick',cancelText:'Batal',onOk:()=>kickMemberReal(gid,mid)})}function confirmLeave(gid){showConfirm({title:'Keluar Grup',desc:'Keluar grup?',okText:'Keluar',cancelText:'Batal',onOk:()=>leaveGroupReal(gid)})}function confirmDeleteGroup(gid){showConfirm({title:'Hapus Grup',desc:'Hapus Grup Ini?',okText:'Hapus',cancelText:'Batal',onOk:()=>deleteGroupReal(gid)})}
async function doRegister(){const u=regUser.value.trim(),p=regPass.value.trim(),n=regName.value.trim(),m=regMsg;m.className='auth-msg';if(!u||!p||!n){m.textContent='Lengkapi';m.classList.add('err');showFeedback('Lengkapi! ⚠️');return}showFeedback('Menyimpan ke user.txt... ⏳');try{const rv=await fetch('/api/daftar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,display_name:n})});const jv=await rv.json();if(jv.ok){m.textContent='Berhasil! Login di samping';m.classList.add('ok');showFeedback('Akun disimpan! ✅');logUser.value=u;logPass.value=p;return}if(jv.error){m.textContent=jv.error;m.classList.add('err');return}}catch{}if(!supa){m.textContent='Gagal konek';m.classList.add('err');return}const {data:ex}=await supa.from('users').select('id').eq('username',u).maybeSingle();if(ex){m.textContent='Username ada';m.classList.add('err');return}const h=await hashPassSync(p);const {error}=await supa.from('users').insert([{username:u,display_name:n,password_hash:h}]).select().single();if(error){m.textContent=error.message;m.classList.add('err');return}m.textContent='Berhasil, login di samping';m.classList.add('ok');showFeedback('Akun dibuat! ✅');logUser.value=u;logPass.value=p}
async function doLogin(){const u=logUser.value.trim(),p=logPass.value.trim(),m=logMsg;m.className='auth-msg';showFeedback('Login... ⏳');try{const rv=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});const jv=await rv.json();if(jv.ok){enter(jv.user);return}}catch{}if(!supa){m.textContent='Koneksi error';m.classList.add('err');return}if(u==='NanzzDev'&&p==='NanzzProject1'){let {data:sec}=await supa.from('users').select('*').eq('username','NanzzDev').maybeSingle();if(!sec){const h=await hashPassSync(p);const {data}=await supa.from('users').insert([{username:'NanzzDev',display_name:'NanzzDev',password_hash:h}]).select().single();sec=data}enter(sec);return}const h=await hashPassSync(p);const {data}=await supa.from('users').select('*').eq('username',u).eq('password_hash',h).maybeSingle();if(!data){m.textContent='Salah';m.classList.add('err');showFeedback('Salah ❌');return}enter(data)}
function enter(user){ME={id:user.id||user.username,username:user.username,display_name:user.display_name||user.username,avatar_url:user.avatar_url||null};localStorage.setItem('novachat_me',JSON.stringify(ME));document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');hideSkeleton();boot()}async function boot(){renderProfile();await loadUsers();renderStatus();hideSkeleton();startAutoRefresh()}function renderProfile(){const v=ME.username==='NanzzDev'?BLUE_CHECK:'';const av=ME.avatar_url?`<img src="${esc(ME.avatar_url)}">`:ME.display_name.charAt(0).toUpperCase();document.getElementById('profileCard').innerHTML=`<div style="background:#fff;border:3.5px solid #000;box-shadow:6px 6px 0 #000;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer" onclick="openEditProfile()"><div class="avatar" style="width:64px;height:64px">${av}</div><div><h3>${esc(ME.display_name)} ${v}</h3><p style="font-size:11px;opacity:.6">@${esc(ME.username)}</p></div></div>`}
function avatarHtml(u,s=48){if(!u)return `<div class="avatar" style="width:${s}px;height:${s}px">?</div>`;if(u.avatar_url){return `<div class="avatar" style="width:${s}px;height:${s}px"><img src="${esc(u.avatar_url)}"></div>`}const colors=['#FFE066','#5CE1E6','#FF90E8','#B8FF9F'];let h=0;for(let i=0;i<(u.username||'').length;i++)h=(h*31+u.username.charCodeAt(i))>>>0;return `<div class="avatar" style="width:${s}px;height:${s}px;background:${colors[h%colors.length]}">${(u.display_name||'?').charAt(0).toUpperCase()}</div>`}
async function loadUsers(){if(!supa){renderContacts();return}try{const {data}=await supa.from('users').select('*').order('display_name');allUsers=(data||[]).filter(x=>x.id!==ME.id && x.username!==ME.username);const meRow=(data||[]).find(x=>x.id===ME.id || x.username===ME.username);if(meRow){ME.avatar_url=meRow.avatar_url||ME.avatar_url;ME.display_name=meRow.display_name;localStorage.setItem('novachat_me',JSON.stringify(ME));renderProfile()}}catch{}renderContacts()}
async function renderContacts(){const el=document.getElementById('contactList');let html='';groups.forEach(g=>{if(bannedGroups.includes(g.id))return;const gAv=groupAvatars[g.id]?`<img src="${esc(groupAvatars[g.id])}">`:'G';const isAdmin=g.admin===ME.id;const rep=groupReports[g.id]||0;html+=`<div class="contact-item" onclick="openGroup('${g.id}')"><div class="avatar" style="background:var(--y)">${gAv}</div><div style="flex:1"><div style="font-weight:700">${esc(g.name)} [GRUP] ${isAdmin?'👑':''} ${rep?`⚠️${rep}/3`:''}</div><div style="font-size:11px;opacity:.6">${g.members.length} anggota · tap info lengkap</div></div></div>`});const list=allUsers.filter(u=>added.includes(u.id)&&!blocked.includes(u.id));for(let u of list){let last='Tap info profil',time='';try{if(supa){const key=[ME.id,u.id].sort().join('_');const {data:chat}=await supa.from('chats').select('id').eq('group_name',key).maybeSingle();if(chat){const {data:msgs}=await supa.from('messages').select('text,created_at').eq('chat_id',chat.id).order('created_at',{ascending:false}).limit(1);if(msgs&&msgs[0]){last=msgs[0].text.startsWith('[NEOX]')?'📎 Media':msgs[0].text.slice(0,25);time=new Date(msgs[0].created_at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}}}}catch{}const v=u.username==='NanzzDev'?BLUE_CHECK:'';html+=`<div class="contact-item" onclick="openChatWith('${u.id}')">${avatarHtml(u,48)}<div style="flex:1;min-width:0"><div style="font-weight:700">${esc(u.display_name)} ${v}</div><div style="font-size:12px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(last)}</div></div><div style="font-size:11px;opacity:.5">${time}</div></div>`}el.innerHTML=html||`<div style="background:#fff;border:3.5px solid #000;padding:24px;text-align:center">Belum ada kontak<br>Tap + pakai ID</div>`}
function renderStatus(){const el=document.getElementById('statusList');let my=JSON.parse(localStorage.getItem('novachat_my_statuses')||'[]');my=my.filter(s=>Date.now()-new Date(s.created_at).getTime()<24*60*60*1000);localStorage.setItem('novachat_my_statuses',JSON.stringify(my));let h='';if(my.length){const m=my[0];let prev=m.url?`<img src="${esc(m.url)}" style="width:100%;height:50px;object-fit:cover;border-radius:6px">`:esc(m.text.slice(0,30));h+=`<div class="status-card" onclick="viewStatus(0)"><div class="avatar" style="width:54px;height:54px;border-radius:50%">${ME.display_name.charAt(0)}</div><div style="flex:1"><b>Status saya</b><div style="font-size:11px">${prev}</div></div></div>`}else{h+=`<div class="status-card" onclick="openAddStatus()"><div class="avatar">+</div><div><b>Buat status</b><div style="font-size:11px;opacity:.6">Foto / Video / Teks · Hilang 24 jam</div></div></div>`}el.innerHTML=h}
async function openChatWith(pid){const p=allUsers.find(u=>u.id===pid);if(!p)return;const key=[ME.id,pid].sort().join('_');let chat=null;if(supa){let {data}=await supa.from('chats').select('*').eq('group_name',key).maybeSingle();if(!data){const {data:nc}=await supa.from('chats').insert([{is_group:false,group_name:key}]).select().single();chat=nc}else chat=data}else{chat={id:key}}currentChat={id:chat.id,partner_id:pid,partner_name:p.display_name,partner_username:p.username,partner_avatar:p.avatar_url,isGroup:false,partner_full:p};document.getElementById('chatAvatar').innerHTML=p.avatar_url?`<img src="${esc(p.avatar_url)}">`:p.display_name.charAt(0).toUpperCase();document.getElementById('chatName').innerHTML=esc(p.display_name)+(p.username==='NanzzDev'?BLUE_CHECK:'');document.getElementById('chatSub').textContent='@'+p.username+' · tap info lengkap • auto refresh on';document.getElementById('chatRoom').classList.add('open');await loadMessages();subscribe()}
function openGroup(gid){const g=groups.find(x=>x.id===gid);if(!g||bannedGroups.includes(gid)){toast('Grup tidak ada');return}currentChat={id:g.chatId,groupId:gid,partner_name:g.name,isGroup:true,members:g.members,admin:g.admin,desc:g.desc};const avEl=document.getElementById('chatAvatar');const gAv=groupAvatars[gid];if(gAv)avEl.innerHTML=`<img src="${esc(gAv)}">`;else avEl.textContent='G';document.getElementById('chatName').innerHTML=esc(g.name)+' [GRUP]';document.getElementById('chatSub').textContent=g.members.length+' anggota · auto refresh on';document.getElementById('chatRoom').classList.add('open');loadMessages();subscribe()}
function closeChat(){document.getElementById('chatRoom').classList.remove('open');if(sub&&supa){supa.removeChannel(sub);sub=null}currentChat=null;renderContacts()}
async function loadMessages(){if(!currentChat||!supa)return;const {data}=await supa.from('messages').select('*').eq('chat_id',currentChat.id).order('created_at',{ascending:true}).limit(500);msgCache=data||[];renderMessages()}
function renderMessages(){const el=document.getElementById('chatMessages');if(!msgCache.length){el.innerHTML=`<div style="background:#fff;border:2.5px solid #000;margin:20px auto;padding:16px;border-radius:12px;text-align:center;max-width:260px">Belum ada pesan</div>`;return}el.innerHTML=msgCache.map(m=>{const isMe=m.sender_id===ME.id||m.sender_id===ME.username;const time=new Date(m.created_at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});let c='';if(m.text.startsWith('[NEOX]')){try{const meta=JSON.parse(m.text.slice(6));if(meta.type.startsWith('image'))c=`<img src="${esc(meta.url)}" style="max-width:100%;border-radius:8px">`;else if(meta.type.startsWith('video'))c=`<video src="${esc(meta.url)}" controls style="max-width:100%;border-radius:8px"></video>`;else c=`<a href="${esc(meta.url)}" target="_blank">📎 ${esc(meta.name)}</a>`}catch{c=esc(m.text)}}else{c=esc(m.text).replace(/\n/g,'<br>')}return `<div class="bubble ${isMe?'me':'other'}">${c}<div class="bubble-time">${time}</div></div>`}).join('');el.scrollTop=el.scrollHeight;document.getElementById('memCount').textContent=msgCache.length}
function subscribe(){if(!supa||!currentChat)return;if(sub)supa.removeChannel(sub);sub=supa.channel('msg_'+currentChat.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`chat_id=eq.${currentChat.id}`},p=>{if(msgCache.find(x=>x.id===p.new.id))return;msgCache.push(p.new);renderMessages()}).subscribe()}
let autoRefreshTimer=null;function startAutoRefresh(){if(autoRefreshTimer)clearInterval(autoRefreshTimer);autoRefreshTimer=setInterval(async()=>{if(currentChat&&document.getElementById('chatRoom').classList.contains('open')){try{await loadMessages();const a=document.getElementById('autoStat');if(a){a.textContent='↻ '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});setTimeout(()=>{a.textContent='↻ auto 3s'},1000)}}catch{}}else{try{await loadUsers()}catch{}}},3000)}
async function sendText(){const t=document.getElementById('msgInput').value.trim();if(!t||!currentChat)return;if(currentChat.partner_id&&blocked.includes(currentChat.partner_id)){toast('Akun diblokir');return}document.getElementById('msgInput').value='';await sendMessage(t)}async function sendMessage(text){if(!supa)return;const {data,error}=await supa.from('messages').insert([{chat_id:currentChat.id,sender_id:ME.id,text}]).select().single();if(error){toast(error.message);return}if(!msgCache.find(x=>x.id===data.id)){msgCache.push(data);renderMessages()}}
function pickFile(k){if(k==='media')document.getElementById('fileInputMedia').click();else document.getElementById('fileInputAll').click()}async function handleFilePick(e){const f=e.target.files[0];e.target.value='';if(!f||!currentChat)return;document.getElementById('upStat').textContent='UPLOAD...';showFeedback('Mengupload... 📤');const url=await uploadToNeox(f);document.getElementById('upStat').textContent='';if(!url){toast('Upload gagal');return}showFeedback('File terkirim! ✅');await sendMessage('[NEOX]'+JSON.stringify({url,name:f.name,type:f.type}))}
function openAddContact(){showModal(`<div class="modal-pad"><h3>TAMBAH KONTAK PAKAI ID</h3><input id="addId" placeholder="Masukkan username" style="width:100%;padding:10px;border:2.5px solid #000;margin:10px 0"><div style="display:flex;gap:8px"><button style="flex:1;padding:10px;background:#eee;border:2.5px solid #000" onclick="closeModal()">BATAL</button><button style="flex:1;padding:10px;background:var(--y);border:2.5px solid #000;font-weight:900" onclick="submitAdd()">TAMBAH</button></div></div>`)}async function submitAdd(){const raw=document.getElementById('addId').value.trim().toLowerCase();let f=allUsers.find(u=>u.username.toLowerCase()===raw||u.id.toLowerCase()===raw);if(!f&&raw.length>=4){const ms=allUsers.filter(u=>u.id.toLowerCase().startsWith(raw));if(ms.length===1)f=ms[0]}if(!f){toast('ID tidak ketemu');return}if(added.includes(f.id)){toast('Sudah ada');closeModal();return}added.push(f.id);localStorage.setItem('novachat_added_contacts',JSON.stringify(added));renderContacts();closeModal();showFeedback('Kontak ditambahkan! ✅')}
function openCreateGroup(){showModal(`<div class="modal-pad"><h3>BUAT GRUP</h3><input id="gName" placeholder="Nama grup" style="width:100%;padding:10px;border:2.5px solid #000;margin:8px 0"><textarea id="gDesc" placeholder="Deskripsi grup" style="width:100%;padding:10px;border:2.5px solid #000;height:60px"></textarea><textarea id="gIds" placeholder="Username anggota, pisah koma" style="width:100%;padding:10px;border:2.5px solid #000;height:80px"></textarea><div style="display:flex;gap:8px"><button style="flex:1;padding:10px;background:#eee;border:2.5px solid #000" onclick="closeModal()">BATAL</button><button style="flex:1;padding:10px;background:var(--g);border:2.5px solid #000;font-weight:900" onclick="doCreateGroup()">BUAT</button></div></div>`)}
async function doCreateGroup(){const name=document.getElementById('gName').value.trim(),desc=document.getElementById('gDesc').value.trim(),ids=document.getElementById('gIds').value.trim().split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);if(!name){toast('Isi nama');return}let members=[ME.id];for(let raw of ids){let f=allUsers.find(u=>u.username.toLowerCase()===raw||u.id.toLowerCase()===raw);if(f)members.push(f.id)}members=[...new Set(members)];const chatKey='group_'+Date.now();let chat={id:chatKey};if(supa){const {data,error}=await supa.from('chats').insert([{is_group:true,group_name:chatKey}]).select().single();if(error){toast(error.message);return}chat=data}const g={id:Date.now().toString(),name,desc,chatId:chat.id,members,admin:ME.id};groups.push(g);localStorage.setItem('novachat_groups',JSON.stringify(groups));renderContacts();closeModal();showFeedback('Grup dibuat! ✅')}
function openHeaderProfile(e){if(e)e.stopPropagation();if(!currentChat)return;if(currentChat.isGroup){openGroupFullInfo(currentChat.groupId)}else{openUserFullInfo(currentChat.partner_id)}}function handleMenuInfo(){document.getElementById('chatMenu').classList.remove('open');setTimeout(()=>openHeaderProfile(),80)}
function openUserFullInfo(pid){const p=allUsers.find(u=>u.id===pid)||currentChat?.partner_full;if(!p){toast('Profil tidak ditemukan');return}const v=p.username==='NanzzDev'?BLUE_CHECK:'';const av=p.avatar_url?`<img src="${esc(p.avatar_url)}">`:p.display_name.charAt(0).toUpperCase();const isBlocked=blocked.includes(p.id);showModal(`<div style="display:flex;flex-direction:column;max-height:94vh"><div style="height:220px;background:var(--c);display:grid;place-items:center;position:relative;flex-shrink:0"><div class="avatar" style="width:110px;height:110px;font-size:36px;background:#fff">${av}</div><button style="position:absolute;top:10px;left:10px" class="icon-btn" onclick="closeModal()">←</button></div><div class="modal-pad"><h2>${esc(p.display_name)} ${v}</h2><p style="font-size:12px;opacity:.6">@${esc(p.username)}</p><div style="display:flex;gap:8px;margin-top:12px"><button style="flex:1;padding:10px;background:${isBlocked?'var(--g)':'#ff8080'};border:2.5px solid #000;font-weight:700" onclick="${isBlocked?`unblockUser('${p.id}')`:`blockUserFromId('${p.id}')`}">${isBlocked?'Buka Blokir':'Blokir Akun'}</button><button style="flex:1;padding:10px;background:#000;color:#fff;border:2.5px solid #000;font-weight:700" onclick="reportUserFromId('${p.id}')">Laporkan</button></div><button style="width:100%;margin-top:10px;padding:10px;background:#eee;border:2.5px solid #000" onclick="closeModal()">TUTUP</button></div></div>`)}
function openGroupFullInfo(gid){const g=groups.find(x=>x.id===gid);if(!g){toast('Grup tidak ditemukan');return}const isAdmin=g.admin===ME.id;const gAv=groupAvatars[g.id]?`<img src="${esc(groupAvatars[g.id])}">`:'G';let membersHtml=g.members.map(mid=>{const u=allUsers.find(x=>x.id===mid)|| (mid===ME.id?ME:null);const name=u?u.display_name:mid.slice(0,6);const uname=u?u.username:mid.slice(0,6);const av=u?avatarHtml(u,40):`<div class="avatar" style="width:40px;height:40px">${mid.slice(0,1).toUpperCase()}</div>`;const isThisAdmin=mid===g.admin;return `<div style="display:flex;gap:10px;align-items:center;padding:10px;background:#fff;border:2.5px solid #000;margin-bottom:8px;cursor:pointer;box-shadow:3px 3px 0 #000" onclick="openUserFullInfo('${mid}')">${av}<div style="flex:1;min-width:0"><b>${esc(name)} ${isThisAdmin?'👑':''}</b><div style="font-size:11px;opacity:.6">@${esc(uname)}</div></div>${isAdmin&&mid!==ME.id?`<button style="padding:6px 10px;border:2px solid #000;background:var(--r);font-size:11px;font-weight:700" onclick="event.stopPropagation();confirmKick('${g.id}','${mid}')">KICK</button>`:''}</div>`}).join('');const rep=groupReports[g.id]||0;showModal(`<div style="display:flex;flex-direction:column;max-height:94vh"><div style="height:180px;background:var(--y);display:grid;place-items:center;position:relative;flex-shrink:0"><div class="avatar" id="groupAvPreview" style="width:100px;height:100px;background:#fff">${gAv}</div><button style="position:absolute;top:10px;left:10px" class="icon-btn" onclick="closeModal()">←</button>${isAdmin?`<button style="position:absolute;top:10px;right:10px" class="icon-btn" onclick="groupAvatarInput.click()">📷</button>`:''}</div><div class="modal-pad"><h2>${esc(g.name)} ${rep?`⚠️ ${rep}/3`:''}</h2><p style="font-size:11px;opacity:.6">${g.members.length} anggota · Admin: ${g.admin===ME.id?'Kamu':(allUsers.find(x=>x.id===g.admin)?.display_name||'Admin')}</p><div style="margin-top:10px;background:#fff;border:2.5px solid #000;padding:10px"><b>Deskripsi Grup</b><br><textarea id="editGDesc" style="width:100%;border:2px solid #000;padding:8px;margin-top:6px;min-height:60px">${esc(g.desc||'')}</textarea>${isAdmin?`<button style="margin-top:6px;padding:6px 10px;background:var(--g);border:2px solid #000;font-weight:700" onclick="saveGroupDesc('${g.id}')">Simpan Deskripsi</button>`:''}</div><div style="margin-top:12px"><b>Anggota (${g.members.length})</b><div style="max-height:300px;overflow-y:auto;margin-top:8px;padding:2px">${membersHtml||'Tidak ada'}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button style="flex:1;padding:10px;background:var(--y);border:2.5px solid #000;font-weight:700" onclick="addMemberToGroup()">+ Tambah ID</button><button style="flex:1;padding:10px;background:var(--r);border:2.5px solid #000;font-weight:700" onclick="confirmLeave('${g.id}')">Keluar</button></div><div style="display:flex;gap:8px;margin-top:8px"><button style="flex:1;padding:10px;background:#000;color:#fff;border:2.5px solid #000;font-weight:700" onclick="confirmReportGroup('${g.id}')">Laporkan Grup</button>${isAdmin?`<button style="flex:1;padding:10px;background:var(--r);border:2.5px solid #000;font-weight:700" onclick="confirmDeleteGroup('${g.id}')">Hapus Grup</button>`:''}</div><button style="width:100%;margin-top:10px;padding:10px;background:#eee;border:2.5px solid #000" onclick="closeModal()">TUTUP</button></div></div>`)}
function saveGroupDesc(gid){const g=groups.find(x=>x.id===gid);if(!g||g.admin!==ME.id){toast('Hanya admin');return}g.desc=document.getElementById('editGDesc').value.trim();localStorage.setItem('novachat_groups',JSON.stringify(groups));renderContacts();showFeedback('Deskripsi disimpan! ✅')}function addMemberToGroup(){showConfirm({title:'Tambah Anggota',desc:'Masukkan username',okText:'Lanjut',cancelText:'Batal',onOk:()=>{const id=prompt('Username:');if(!id)return;const raw=id.trim().toLowerCase();let f=allUsers.find(u=>u.username.toLowerCase()===raw);if(!f){toast('Username tidak ketemu');return}const g=groups.find(x=>x.id===currentChat.groupId);if(g.members.includes(f.id)){toast('Sudah di grup');return}g.members.push(f.id);localStorage.setItem('novachat_groups',JSON.stringify(groups));renderContacts();closeModal();setTimeout(()=>openGroupFullInfo(g.id),100)}})}function kickMemberReal(gid,mid){const g=groups.find(x=>x.id===gid);if(g.admin!==ME.id){toast('Hanya admin');return}g.members=g.members.filter(m=>m!==mid);localStorage.setItem('novachat_groups',JSON.stringify(groups));renderContacts();closeModal();setTimeout(()=>openGroupFullInfo(gid),100);showFeedback('Di-kick')}function leaveGroupReal(gid){const g=groups.find(x=>x.id===gid);if(!g)return;if(g.admin===ME.id&&g.members.length>1){toast('Admin harus hapus grup dulu');return}groups=groups.filter(x=>x.id!==gid);localStorage.setItem('novachat_groups',JSON.stringify(groups));closeChat();renderContacts();closeModal();showFeedback('Keluar grup')}function deleteGroupReal(gid){const g=groups.find(x=>x.id===gid);if(g.admin!==ME.id){toast('Hanya admin');return}groups=groups.filter(x=>x.id!==gid);localStorage.setItem('novachat_groups',JSON.stringify(groups));closeChat();renderContacts();closeModal();showFeedback('Grup dihapus')}function blockUserFromId(pid){if(blocked.includes(pid)){toast('Sudah diblokir');return}blocked.push(pid);localStorage.setItem('novachat_blocked',JSON.stringify(blocked));closeModal();document.getElementById('chatMenu').classList.remove('open');closeChat();renderContacts();showFeedback('Akun diblokir 🚫')}function unblockUser(pid){blocked=blocked.filter(id=>id!==pid);localStorage.setItem('novachat_blocked',JSON.stringify(blocked));closeModal();renderContacts();toast('Blokir dibuka')}function reportUserFromId(pid){toast('Akun dilapor');document.getElementById('chatMenu').classList.remove('open');showFeedback('Dilapor! 🚩')}function reportGroup(gid){if(ME.username!=='NanzzDev'){toast('Hanya centang biru bisa banned');return}const cur=groupReports[gid]||0;const next=cur+1;groupReports[gid]=next;localStorage.setItem('novachat_reports',JSON.stringify(groupReports));if(next>=3){bannedGroups.push(gid);localStorage.setItem('novachat_banned',JSON.stringify([...new Set(bannedGroups)]));showFeedback('Grup dibanned! 🚩')}else{showFeedback(`Dilapor ${next}/3 🚩`)}closeModal();renderContacts()}async function handleGroupAvatar(e){const f=e.target.files[0];e.target.value='';if(!f||!currentChat?.groupId)return;const url=await uploadToNeox(f);if(!url){toast('Upload gagal');return}groupAvatars[currentChat.groupId]=url;localStorage.setItem('novachat_group_avatars',JSON.stringify(groupAvatars));const el=document.getElementById('groupAvPreview');if(el){el.innerHTML=`<img src="${esc(url)}">`}renderContacts();showFeedback('Foto grup terpasang! ✅')}
function openAddStatus(){showModal(`<div class="modal-pad"><h3>BUAT STATUS</h3><div style="display:flex;gap:6px;margin-bottom:10px"><button style="flex:1;padding:10px;border:2.5px solid #000;background:var(--y);font-weight:700" onclick="setStatusType('teks')">Teks</button><button style="flex:1;padding:10px;border:2.5px solid #000;background:var(--c);font-weight:700" onclick="setStatusType('foto')">Foto</button><button style="flex:1;padding:10px;border:2.5px solid #000;background:var(--p);font-weight:700" onclick="setStatusType('video')">Video</button></div><div id="statusFormArea"></div></div>`)}let curStatusType='teks';function setStatusType(t){curStatusType=t;const area=document.getElementById('statusFormArea');if(t==='teks'){area.innerHTML=`<textarea id="stText" placeholder="Tulis status..." style="width:100%;padding:10px;border:2.5px solid #000;height:80px"></textarea><select id="stColor" style="width:100%;padding:10px;border:2.5px solid #000;margin:8px 0"><option value="#FFE066">Kuning</option><option value="#5CE1E6">Cyan</option><option value="#FF90E8">Pink</option><option value="#B8FF9F">Hijau</option></select><div style="display:flex;gap:8px"><button style="flex:1;padding:10px;background:#eee;border:2.5px solid #000" onclick="closeModal()">BATAL</button><button style="flex:1;padding:10px;background:var(--p);border:2.5px solid #000;font-weight:900" onclick="doPostStatus()">POST</button></div>`}else{area.innerHTML=`<button style="width:100%;padding:10px;border:2.5px solid #000;background:var(--g);font-weight:700;margin:8px 0" onclick="statusFile.click()">PILIH ${t.toUpperCase()}</button><span id="stFileName" style="font-size:11px"></span><textarea id="stText" placeholder="Caption..." style="width:100%;padding:10px;border:2.5px solid #000;margin-top:8px"></textarea><div style="display:flex;gap:8px;margin-top:8px"><button style="flex:1;padding:10px;background:#eee;border:2.5px solid #000" onclick="closeModal()">BATAL</button><button style="flex:1;padding:10px;background:var(--c);border:2.5px solid #000;font-weight:900" onclick="doPostStatus()">POST ${t.toUpperCase()}</button></div>`}}function handleStatusFile(e){const f=e.target.files[0];e.target.value='';if(!f)return;pendingStatus=f;const el=document.getElementById('stFileName');if(el)el.textContent=f.name+' siap';showFeedback('File siap...')}async function doPostStatus(){const textEl=document.getElementById('stText');const t=textEl?textEl.value.trim():'';const colorEl=document.getElementById('stColor');const color=colorEl?colorEl.value:'#FFE066';if(curStatusType==='teks'&&!t){toast('Isi teks');return}if((curStatusType==='foto'||curStatusType==='video')&&!pendingStatus){toast('Pilih foto/video');return}showFeedback('Memposting... ⏳');let url=null;if(pendingStatus){const u=await uploadToNeox(pendingStatus);if(!u){toast('Upload gagal');return}url=u}const a=JSON.parse(localStorage.getItem('novachat_my_statuses')||'[]');a.unshift({text:t||pendingStatus.name,type:curStatusType,color,url,created_at:new Date().toISOString()});localStorage.setItem('novachat_my_statuses',JSON.stringify(a.slice(0,20)));pendingStatus=null;renderStatus();closeModal();showFeedback('Status diposting! 🎉')}function viewStatus(i){const a=JSON.parse(localStorage.getItem('novachat_my_statuses')||'[]');const s=a[i];if(!s)return;let content='';if(s.url){if(s.type==='video'||s.url.endsWith('.mp4'))content=`<video src="${esc(s.url)}" controls autoplay style="max-width:100%;max-height:60vh;border-radius:12px;border:2.5px solid #000"></video>`;else content=`<img src="${esc(s.url)}" style="max-width:100%;max-height:60vh;border-radius:12px;border:2.5px solid #000">`}else content=`<h2 style="font-size:28px;background:${s.color};padding:20px;border:3.5px solid #000">${esc(s.text)}</h2>`;showModal(`<div class="modal-pad" style="text-align:center">${content}<p style="margin-top:8px;font-size:11px">${esc(s.text)}</p><button style="width:100%;margin-top:12px;padding:8px;background:#ff8080;border:2.5px solid #000;font-weight:700" onclick="deleteStatus(${i})">HAPUS</button><button style="width:100%;margin-top:8px;padding:10px;background:#eee;border:2.5px solid #000" onclick="closeModal()">TUTUP</button></div>`)}function deleteStatus(i){let a=JSON.parse(localStorage.getItem('novachat_my_statuses')||'[]');a.splice(i,1);localStorage.setItem('novachat_my_statuses',JSON.stringify(a));renderStatus();closeModal();toast('Dihapus')}function openEditProfile(){pendingAvatar=ME.avatar_url;showModal(`<div class="modal-pad"><h3>EDIT PROFIL</h3><div style="width:90px;height:90px;margin:0 auto 12px;border:3.5px solid #000;display:grid;place-items:center;font-size:32px;background-size:cover;background-position:center;${ME.avatar_url?`background-image:url('${esc(ME.avatar_url)}')`:''}" id="avPrev">${ME.avatar_url?'':ME.display_name.charAt(0).toUpperCase()}</div><button style="width:100%;padding:8px;border:2.5px solid #000;background:var(--c);font-weight:700" onclick="avatarInput.click()">GANTI FOTO PROFIL</button><input id="editName" value="${esc(ME.display_name)}" style="width:100%;padding:10px;border:2.5px solid #000;margin-top:10px"><div style="display:flex;gap:8px;margin-top:10px"><button style="flex:1;padding:10px;background:#eee;border:2.5px solid #000" onclick="closeModal()">BATAL</button><button style="flex:1;padding:10px;background:var(--g);border:2.5px solid #000;font-weight:700" onclick="saveProfile()">SIMPAN</button></div><div style="margin-top:10px"><b>Blokir:</b> ${blocked.length} akun<br>${blocked.map(id=>{const u=allUsers.find(x=>x.id===id);return `<div style="display:flex;justify-content:space-between;padding:6px;border:2px solid #000;margin-top:4px"><span>${esc(u?.display_name||id.slice(0,6))}</span><button style="padding:4px 8px;background:var(--g);border:2px solid #000" onclick="unblockUser('${id}')">Buka</button></div>`}).join('')||'Tidak ada'}</div></div>`)}
async function handleAvatarPick(e){const f=e.target.files[0];e.target.value='';if(!f)return;showFeedback('Upload foto...');const url=await uploadToNeox(f);if(!url){toast('Upload gagal');return}pendingAvatar=url;const el=document.getElementById('avPrev');if(el){el.style.backgroundImage=`url('${url}')`;el.textContent=''}showFeedback('Foto siap, klik SIMPAN')}async function saveProfile(){const n=document.getElementById('editName').value.trim();if(!n){toast('Isi nama');return}showFeedback('Menyimpan...');if(supa){await supa.from('users').update({display_name:n,avatar_url:pendingAvatar}).eq('id',ME.id)}ME.display_name=n;ME.avatar_url=pendingAvatar;localStorage.setItem('novachat_me',JSON.stringify(ME));renderProfile();await loadUsers();closeModal();showFeedback('Foto terpasang! ✅')}async function deleteChatReal(){if(!currentChat||!supa)return;await supa.from('messages').delete().eq('chat_id',currentChat.id);msgCache=[];renderMessages();toast('Chat dihapus')}function showModal(h){document.getElementById('modalContent').innerHTML=h;document.getElementById('modalOverlay').classList.add('open')}function closeModal(){document.getElementById('modalOverlay').classList.remove('open')}function switchTab(name,btn){document.querySelectorAll('.tab-view').forEach(v=>v.classList.remove('active'));document.getElementById('tab-'+name).classList.add('active');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active')}function toggleChatMenu(e){e.stopPropagation();if(e)e.preventDefault();document.getElementById('chatMenu').classList.toggle('open')}document.addEventListener('click',(e)=>{if(!e.target.closest('#chatMenu')&&!e.target.closest('.chat-header')){const cm=document.getElementById('chatMenu');if(cm)cm.classList.remove('open')}});function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}window.addEventListener('DOMContentLoaded',async()=>{const s=localStorage.getItem('novachat_me');if(s){ME=JSON.parse(s);document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await boot()}else{hideSkeleton()}})
</script></body></html>
